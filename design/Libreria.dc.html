<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Libreria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:radial-gradient(110% 55% at 100% 0%, rgba(205,228,170,.42), rgba(245,247,242,0) 62%), #F5F7F2;color:#17191C;font-family:'Manrope',system-ui,sans-serif">
  <div style="position:absolute;inset:0;overflow-y:auto;padding:24px 20px 132px;box-sizing:border-box">
    <header style="text-align:center">
      <span style="display:block;font-weight:800;letter-spacing:-.03em;font-size:28px;line-height:1">Eddy</span>
      <h1 style="margin:22px 0 10px;font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-.02em">Libreria</h1>
      <p style="margin:0 auto;max-width:300px;font-size:16px;line-height:1.5;color:#4A5560">Uno spazio personale per ritrovare ciò che merita più tempo e attenzione.</p>
    </header>

    <div role="group" aria-label="Sezioni della Libreria" style="margin-top:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:5px;border-radius:26px;background:#E3EAE3">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height:48px;border:0;border-radius:21px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;background:{{t.bg}};color:{{t.color}};box-shadow:{{t.shadow}}">
          {{t.label}}
          <span style="min-width:22px;height:22px;border-radius:11px;background:{{t.badgeBg}};font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center">{{t.count}}</span>
        </button>
      </sc-for>
    </div>

    <section aria-live="polite" style="margin-top:14px;background:#FFFFFF;border-radius:30px;box-shadow:0 1px 2px rgba(23,25,28,.06),0 14px 34px rgba(23,25,28,.08)">
      <sc-if value="{{empty}}" hint-placeholder-val="{{ true }}">
        <div style="min-height:400px;box-sizing:border-box;padding:32px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
          <span aria-hidden="true" style="width:76px;height:76px;border-radius:38px;background:#E6EFE8;color:#2F5443;display:flex;align-items:center;justify-content:center">
            <sc-if value="{{tab0}}" hint-placeholder-val="{{ true }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></sc-if>
            <sc-if value="{{tab1}}" hint-placeholder-val="{{ false }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></sc-if>
            <sc-if value="{{tab2}}" hint-placeholder-val="{{ false }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></sc-if>
          </span>
          <h2 style="margin:22px 0 8px;font-size:22px;line-height:1.2;font-weight:800">{{emptyTitle}}</h2>
          <p style="margin:0;max-width:270px;font-size:16px;line-height:1.5;color:#4A5560">{{emptyText}}</p>
          <a href="Feed.dc.html" style="margin-top:24px;height:52px;padding:0 28px;border-radius:26px;background:#2F5443;color:#FFFFFF;font-size:16px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:8px">
            Vai al Feed
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </a>
        </div>
      </sc-if>
      <sc-if value="{{hasRows}}" hint-placeholder-val="{{ false }}">
        <ul style="margin:0;padding:10px 16px;list-style:none">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
            <li style="display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #EDF0EA">
              <div style="flex:none;width:84px;height:84px;border-radius:20px;overflow:hidden;background:#0B1114">
                <sc-if value="{{r.hasPhoto}}" hint-placeholder-val="{{ false }}">
                  <img src="/_blob/2a1946e8807de345d6ba19cff2e407d7" alt="" style="display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%">
                </sc-if>
                <sc-if value="{{r.noPhoto}}" hint-placeholder-val="{{ true }}">
                  <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true" style="display:block"><rect width="84" height="84" fill="{{r.c1}}"/><circle cx="54" cy="30" r="20" fill="{{r.c2}}"/><path d="M0 62 C22 48 42 70 84 56 V84 H0Z" fill="{{r.c3}}"/></svg>
                </sc-if>
              </div>
              <div style="min-width:0">
                <p style="margin:0 0 4px;font-size:13px;font-weight:700;color:#2F5443">{{r.cat}}</p>
                <h3 style="margin:0;font-size:17px;line-height:1.25;font-weight:800">{{r.title}}</h3>
              </div>
            </li>
          </sc-for>
        </ul>
      </sc-if>
    </section>
  </div>

  <nav aria-label="Navigazione principale" style="position:absolute;left:16px;right:16px;bottom:16px;height:74px;box-sizing:border-box;padding:6px;border-radius:30px;background:rgba(255,255,255,.96);border:1px solid #E3E8DF;box-shadow:0 8px 28px rgba(23,25,28,.14);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:24px;color:#46524B;text-decoration:none;font-size:13px;font-weight:600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Oggi</span>
    </a>
    <a href="Feed.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:24px;color:#46524B;text-decoration:none;font-size:13px;font-weight:600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
      <span>Feed</span>
    </a>
    <a href="Libreria.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:24px;background:#E3ECE5;color:#1F3A2E;text-decoration:none;font-size:13px;font-weight:800">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
      <span>Libreria</span>
    </a>
    <a href="Profilo.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:24px;color:#46524B;text-decoration:none;font-size:13px;font-weight:600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profilo</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"demoData":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 0 };
  }
  renderVals() {
    const demo = !!this.props.demoData;
    const ia = { cat: 'Tecnologia', title: 'Chi decide cosa ci mostra l’intelligenza artificiale?', hasPhoto: true, noPhoto: false, c1: '#17302A', c2: '#E9B872', c3: '#2F5A49' };
    const tempo = { cat: 'Economia', title: 'Quanto vale il nostro tempo in un’economia sempre connessa?', hasPhoto: false, noPhoto: true, c1: '#1D2B3A', c2: '#CFE7D6', c3: '#2D4A5F' };
    const att = { cat: 'Cultura', title: 'L’attenzione è anche una scelta', hasPhoto: false, noPhoto: true, c1: '#2A2A1E', c2: '#E4C9A0', c3: '#4A4A33' };
    const data = demo ? [[ia, tempo], [ia], [att]] : [[], [], []];
    const labels = ['Salvati', 'Recenti', 'Da leggere'];
    const t = this.state.tab;
    const tabs = labels.map((label, i) => {
      const on = t === i;
      return {
        label, on,
        count: data[i].length,
        bg: on ? '#FFFFFF' : 'transparent',
        color: on ? '#17191C' : '#3E4A44',
        shadow: on ? '0 1px 3px rgba(23,25,28,.14)' : 'none',
        badgeBg: on ? '#E3ECE5' : 'rgba(255,255,255,.7)',
        pick: () => this.setState({ tab: i })
      };
    });
    const titles = ['Ancora nessuna storia salvata', 'Nessuna lettura recente', 'La lista è libera'];
    const texts = [
      'Tocca il segnalibro su una storia per conservarla qui.',
      'Le storie che apri compariranno qui, dalla più recente.',
      'Aggiungi una storia a “Da leggere” per conservarla per il momento giusto.'
    ];
    const rows = data[t];
    return {
      tabs,
      rows,
      hasRows: rows.length > 0,
      empty: rows.length === 0,
      tab0: t === 0, tab1: t === 1, tab2: t === 2,
      emptyTitle: titles[t],
      emptyText: texts[t]
    };
  }
}
</script>
</body>
</html>
