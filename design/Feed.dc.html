<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
.feed-scroll{scrollbar-width:none}
.feed-scroll::-webkit-scrollbar{display:none}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0E1311;color:#F6F4EC;font-family:'Manrope',system-ui,sans-serif">

  <div class="feed-scroll" onScroll="{{onScroll}}" tabindex="0" aria-label="Storie del Feed" style="position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory">
    <sc-for list="{{stories}}" as="s" hint-placeholder-count="3">
      <section aria-label="{{s.label}}" style="position:relative;width:390px;height:844px;flex:none;scroll-snap-align:start;overflow:hidden">
        <div style="position:absolute;top:84px;left:20px;right:20px;height:330px;border-radius:30px;overflow:hidden;background:#0B1114">
          <sc-if value="{{s.hasPhoto}}" hint-placeholder-val="{{ true }}">
            <img src="/_blob/2a1946e8807de345d6ba19cff2e407d7" alt="Immagine dimostrativa: sagoma di una persona con uno smartphone acceso dietro un vetro" style="display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%">
          </sc-if>
          <sc-if value="{{s.noPhoto}}" hint-placeholder-val="{{ false }}">
            <svg viewBox="0 0 350 330" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true" style="display:block">
              <rect width="350" height="330" fill="{{s.c1}}"/>
              <circle cx="{{s.cx}}" cy="130" r="100" fill="{{s.c2}}"/>
              <path d="M0 232 C70 190 140 270 215 232 S320 200 350 222 V330 H0Z" fill="{{s.c3}}"/>
              <path d="M0 284 C80 258 150 306 230 282 S320 266 350 276 V330 H0Z" fill="{{s.c4}}"/>
            </svg>
            <span style="position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);color:#FFFFFF;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px">Immagine segnaposto</span>
          </sc-if>
          <span style="position:absolute;left:14px;bottom:14px;background:rgba(40,44,42,.72);color:#FFFFFF;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px">{{s.cat}}</span>
        </div>

        <div style="position:absolute;top:442px;left:20px;right:20px">
          <h2 style="margin:0;font-size:30px;line-height:1.14;font-weight:800;letter-spacing:-.015em;color:#F6F4EC">{{s.title}}</h2>
          <p class="clamp3" style="margin:10px 0 0;font-size:16px;line-height:1.5;color:#C9D0CB">{{s.desc}}</p>
          <p style="margin:16px 0 0;font-size:13px;font-weight:600;color:#9FAAA3">{{s.hint}}</p>
        </div>

        <div style="position:absolute;left:20px;right:20px;bottom:28px;display:flex;gap:10px;align-items:stretch">
          <a href="Storia.dc.html" style="flex:1;min-width:0;height:60px;border-radius:30px;background:#F2F0E8;color:#17191C;text-decoration:none;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 22px;box-sizing:border-box">
            Leggi la storia
            <span aria-hidden="true" style="width:36px;height:36px;border-radius:18px;background:#2F5443;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
          </a>
          <button type="button" onClick="{{s.toggleSave}}" aria-pressed="{{s.saved}}" style="width:78px;height:60px;border-radius:24px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;color:{{s.saveColor}};background:{{s.saveBg}};border:1px solid {{s.saveBorder}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="{{s.saveFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
            {{s.saveLabel}}
          </button>
          <button type="button" onClick="{{s.toggleLater}}" aria-pressed="{{s.later}}" style="width:78px;height:60px;border-radius:24px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;color:{{s.laterColor}};background:{{s.laterBg}};border:1px solid {{s.laterBorder}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            {{s.laterLabel}}
          </button>
        </div>
      </section>
    </sc-for>
  </div>

  <div style="position:absolute;top:0;left:0;right:0;z-index:2;height:84px;padding:20px 20px 0;box-sizing:border-box;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none">
    <p role="status" aria-live="polite" style="margin:0;height:44px;display:flex;align-items:center;font-size:16px;font-weight:700;color:#CFE7D6;font-variant-numeric:tabular-nums">{{counter}}</p>
    <span style="height:44px;display:flex;align-items:center;font-size:28px;font-weight:800;letter-spacing:-.03em">Eddy</span>
    <a href="Main.dc.html" aria-label="Chiudi il Feed e torna a Oggi" style="pointer-events:auto;justify-self:end;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.12);color:#F6F4EC;display:flex;align-items:center;justify-content:center;text-decoration:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0, saved: {}, later: {} };
  }
  renderVals() {
    const base = [
      { id: 'ia', photo: true, cat: 'Tecnologia', title: 'Chi decide cosa ci mostra l’intelligenza artificiale?', desc: 'Dietro ogni risposta c’è una sequenza di scelte: sui dati, sulle regole e su ciò che resta fuori.', c1: '#17302A', c2: '#E9B872', c3: '#2F5A49', c4: '#10231E', cx: 250 },
      { id: 'tempo', photo: false, cat: 'Economia', title: 'Quanto vale il nostro tempo in un’economia sempre connessa?', desc: 'Tempo, competenze e benessere: tre prospettive per capire il rapporto tra economia e vita quotidiana.', c1: '#1D2B3A', c2: '#CFE7D6', c3: '#2D4A5F', c4: '#14212D', cx: 120 },
      { id: 'attenzione', photo: false, cat: 'Cultura', title: 'L’attenzione è anche una scelta', desc: 'Una riflessione sulle abitudini di lettura e sugli spazi che possiamo riservare a ciò che merita tempo.', c1: '#2A2A1E', c2: '#E4C9A0', c3: '#4A4A33', c4: '#1B1B13', cx: 240 }
    ];
    const total = base.length;
    const stories = base.map((b, i) => {
      const sv = !!this.state.saved[b.id];
      const lt = !!this.state.later[b.id];
      return {
        ...b,
        hasPhoto: b.photo,
        noPhoto: !b.photo,
        label: 'Storia ' + (i + 1) + ' di ' + total,
        saved: sv,
        later: lt,
        saveLabel: sv ? 'Salvata' : 'Salva',
        laterLabel: lt ? 'In lista' : 'Da leggere',
        saveFill: sv ? 'currentColor' : 'none',
        saveColor: sv ? '#CFE7D6' : '#F6F4EC',
        saveBg: sv ? 'rgba(207,231,214,.2)' : 'rgba(255,255,255,.08)',
        saveBorder: sv ? '#CFE7D6' : 'rgba(255,255,255,.18)',
        laterColor: lt ? '#CFE7D6' : '#F6F4EC',
        laterBg: lt ? 'rgba(207,231,214,.2)' : 'rgba(255,255,255,.08)',
        laterBorder: lt ? '#CFE7D6' : 'rgba(255,255,255,.18)',
        hint: i === total - 1 ? 'Fine della selezione' : 'Scorri per la storia successiva',
        toggleSave: () => this.setState((st) => ({ saved: { ...st.saved, [b.id]: !st.saved[b.id] } })),
        toggleLater: () => this.setState((st) => ({ later: { ...st.later, [b.id]: !st.later[b.id] } }))
      };
    });
    const idx = this.state.idx;
    const pad = (n) => String(n).padStart(2, '0');
    return {
      stories,
      counter: pad(idx + 1) + ' / ' + pad(total),
      onScroll: (e) => {
        const i = Math.max(0, Math.min(total - 1, Math.round(e.target.scrollTop / 844)));
        if (i !== this.state.idx) this.setState({ idx: i });
      }
    };
  }
}
</script>
</body>
</html>
