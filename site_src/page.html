<title>Eddy</title>
<style>
/* Eddy · fondamenta del design definitivo: carattere Schibsted Grotesk servito dal sito, solo tema chiaro */
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/schibsted-grotesk-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/schibsted-grotesk-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  /* colori */
  --ink:#111216;          /* inchiostro */
  --ink-2:#6B6E76;        /* grigio testo */
  --ink-3:#9A9DA5;        /* grigio chiaro */
  --ink-soft:#5A5D66;     /* righe secondarie (data, conteggi) */
  --line:#E1E3E7;         /* bordi */
  --line-2:#E4E5E9;       /* bordo della barra e dei pulsanti tondi */
  --card:#FFFFFF;
  --pill:#EEEFF2;         /* voce attiva, pulsanti tenui */
  --ph:#DADCE1;           /* posto della foto che non c'è ancora */
  --bg:#F4F5F7;
  /* raggi */
  --r-card:16px;
  --r-sm:14px;
  --r-ph:10px;
  --r-tag:6px;
  /* ombre */
  --sh-card:0 1px 2px rgba(10,15,30,.04);
  --sh-lift:0 12px 30px rgba(10,15,30,.09);
  --sh-nav:0 8px 24px rgba(10,15,30,.08);
  /* luce che cambia con l'ora (la imposta app.js con data-light) */
  --page-bg:linear-gradient(180deg,#FBE6DA 0,#F6F0EC 300px,#F4F5F7 620px);
  --name:#B0502A;
  --font:'Schibsted Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* nomi usati dalle schermate non ancora ridisegnate */
  --surface:var(--card);--surface-2:var(--pill);--surface-3:var(--ph);
  --accent:var(--ink);--accent-2:var(--ink);--accent-ink:#FFFFFF;--accent-soft:var(--pill);--accent-tx:var(--ink);
  --mark:#C25400;--mark-ink:#FFFFFF;--mark-soft:#F7EDE4;--mark-tx:#8A3C00;--danger:#D0021B;--tint:13%;
  --glass:rgba(244,245,247,.9);--glass-2:rgba(255,255,255,.9);--glass-bar:#FFFFFF;--glass-edge:var(--line-2);--edge:0 0 0 1px var(--line);
  --sh-1:var(--sh-card);--sh-2:var(--sh-lift);--sh-float:var(--sh-nav);
  --sans:var(--font);--display:var(--font);--serif:var(--font);
  --r-xl:16px;--r-lg:16px;--r-md:14px;
  --map-sea:#DCE7F0;--map-land:#FAFAFB;--map-line:#B9BEC8;--map-hl:#D7DEEF;--map-grid:rgba(17,18,22,.06);
  --read:17px;
  --nav-h:68px;
  --top-h:0px;
  color-scheme:light;
}
:root[data-light="pomeriggio"]{--page-bg:linear-gradient(180deg,#DFEBF6 0,#EAF0F6 300px,#F4F5F7 620px);--name:#2F6496}
:root[data-light="sera"]{--page-bg:linear-gradient(180deg,#E6E4F4 0,#EEEFF5 300px,#F3F4F6 620px);--name:#5B4CA0;--bg:#F3F4F6}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--page-bg) var(--bg) no-repeat;color:var(--ink)}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;letter-spacing:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility;overflow-x:clip;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 34px)}
body.player-on{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
.art{display:block;width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){
  .press{transition:transform .22s cubic-bezier(.3,.7,.4,1)}
  .press:active{transform:scale(.97)}
  #view.fade{animation:fade .32s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}}
  .pop{animation:pop .36s cubic-bezier(.3,.7,.4,1)}
  @keyframes pop{45%{transform:scale(1.3)}}
}

/* in cima a Oggi: logo "Tre notizie", saluto con il nome colorato, data e aggiornamento */
.ohead{text-align:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 4px 0}
.logo{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:21px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.logo svg{width:25px;height:18px;flex:none}
.greet{margin:14px 0 0;font-weight:800;font-size:31px;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.greet em{font-style:normal;color:var(--name)}
.osub{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 6px;margin-top:6px;font-size:14px;font-weight:500;color:var(--ink-soft)}
.osub b{color:var(--ink);font-weight:600}
.rb{width:44px;height:44px;margin:-10px -8px -10px -4px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink)}
.rb svg{width:17px;height:17px}
.rb.spin svg{animation:spin 1.1s linear infinite}
.iconbtn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:50%;color:var(--ink-2);flex:none}
.iconbtn svg{width:21px;height:21px}

/* titoli di pagina */
.head{position:relative;padding-block:10px 4px}
.head .kicker{display:block;font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:-.005em}
.head h1{font-family:var(--display);font-weight:800;font-size:35px;line-height:1.05;letter-spacing:-.024em;margin:4px 0 0;text-wrap:balance}
.head p{margin:10px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.45;max-width:56ch}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:30px 12px}
.sec h2{margin:0;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.022em;line-height:1.1}
.sec span{font-size:13px;font-weight:550;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec .lnk{font-size:13.5px;font-weight:650;color:var(--accent)}

/* testate in bolle */
.orail{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:16px 16px 6px}
.orail::-webkit-scrollbar{display:none}
.obub{flex:none;display:grid;justify-items:center;gap:7px;width:64px}
.obub .ring{width:62px;height:62px;border-radius:50%;padding:2.5px;background:var(--surface-3);display:grid;place-items:center}
.obub.fresh .ring{background:conic-gradient(from 200deg,var(--accent-2),var(--mark),#7A5CFA,var(--accent-2))}
.obub[aria-pressed="true"] .ring{background:var(--ink)}
.obub .mono{width:57px;height:57px;line-height:57px;font-size:14.5px;box-shadow:0 0 0 3px var(--bg)}
.obub .all{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:0 0 0 3px var(--bg);color:var(--ink)}
.obub .all svg{width:25px;height:25px}
.obub .lbl{font-size:11.5px;font-weight:600;max-width:66px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.obub[aria-pressed="true"] .lbl{color:var(--ink);font-weight:750}

/* monogrammi e loghi */
.mono{--c:#3D4A5C;display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:750 9.5px/26px var(--sans);text-align:center;letter-spacing:.02em;box-shadow:0 0 0 2px var(--ring,var(--surface));flex:none;text-transform:uppercase;overflow:hidden;vertical-align:middle}
.stack{display:inline-flex;flex:none}
.stack .mono+.mono{margin-left:-6px}
.mono.md{width:36px;height:36px;line-height:36px;font-size:11.5px}
.mono.lg{width:56px;height:56px;line-height:56px;font-size:15px}
.mono.haslogo{display:inline-grid;place-items:center;background:var(--lb,#fff);line-height:0}
.mono.haslogo img{display:block;width:72%;height:72%;object-fit:contain}
.mono.haslogo.bleed img{width:100%;height:100%;object-fit:cover}

/* prima pagina: foto con scheda interna */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px -8px;padding:2px 16px 30px;scroll-padding-inline:16px}
.carousel::-webkit-scrollbar{display:none}
.hero{--hp:7px;--hh:clamp(160px,46vw,198px);flex:none;width:min(86%,440px);scroll-snap-align:start;position:relative;display:flex;flex-direction:column;height:calc(var(--hh) + 204px);padding:var(--hp);border-radius:var(--r-xl);background:var(--surface);color:var(--ink);box-shadow:var(--edge),var(--sh-1);cursor:pointer;text-align:left;isolation:isolate}
.hero .hv{position:relative;flex:none}
.hero .hph{height:var(--hh);border-radius:calc(var(--r-xl) - var(--hp));overflow:hidden;background:var(--surface-2)}
.hero .hph>svg,.hero .hph>.vis{width:100%;height:100%}
.hero .hk{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 20px);height:30px;padding:0 13px 0 9px;border-radius:999px;background:rgba(10,16,22,.62);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
.hero .hk svg{width:15px;height:15px;flex:none;color:color-mix(in srgb,var(--tc) 45%,#fff)}
.hero .hcount{position:absolute;right:12px;bottom:-15px;display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums;box-shadow:0 0 0 3px var(--surface),0 8px 18px -8px rgba(0,0,0,.45)}
.hero .hin{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:20px 9px 5px}
.hero .hsrc{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:650;color:var(--ink-2)}
.hero .hsrc .mono{width:28px;height:28px;line-height:28px;font-size:9.5px}
.hero .hsrc>span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .hsrc em{font-style:normal;color:var(--ink-3)}
.hero h3{margin:0;font-family:var(--display);font-weight:760;font-size:19.5px;line-height:1.2;letter-spacing:-.02em;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hero .hmeta{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vpill{--ring:rgba(0,0,0,.3);display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%;height:36px;padding:0 13px 0 5px;border-radius:999px;background:rgba(12,14,14,.42);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:650}
.vpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vpill em{font-style:normal;opacity:.7;font-weight:600}
.dots{display:flex;justify-content:center;gap:6px;padding-top:0}
.dots i{width:6px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 18%,transparent);transition:width .25s,background .25s}
.dots i.on{width:20px;background:var(--ink)}

/* azioni rapide */
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.qbtn{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:var(--r-lg);background:linear-gradient(140deg,color-mix(in srgb,var(--accent-2) 17%,var(--surface)) 0%,var(--surface) 72%);box-shadow:var(--edge),var(--sh-1);text-align:left;min-width:0}
.qbtn.alt{background:linear-gradient(140deg,color-mix(in srgb,var(--mark) 26%,var(--surface)) 0%,var(--surface) 72%)}
.qbtn .disc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 16px -8px color-mix(in srgb,var(--accent) 90%,transparent)}
.qbtn.alt .disc{background:var(--mark);color:var(--mark-ink);box-shadow:0 8px 16px -8px color-mix(in srgb,var(--mark) 90%,transparent)}
.qbtn .disc svg{width:20px;height:20px}
.qbtn strong{display:block;font-size:15px;font-weight:750;line-height:1.2;letter-spacing:-.015em}
.qbtn small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.3;color:var(--ink-3);margin-top:1px}
.qbtn>span{min-width:0}

/* barra dei temi */
.chipbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h));z-index:15;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(22px);backdrop-filter:saturate(1.8) blur(22px);margin-inline:-16px;padding-inline:16px;margin-top:24px}
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:10px;margin-inline:-16px;padding-inline:16px}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px 0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--edge),0 1px 2px rgba(13,18,16,.05);font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s}
.chip svg{width:17px;height:17px;color:var(--tc,var(--ink-3))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 8px 16px -10px rgba(0,0,0,.6)}
.chip[aria-pressed="true"] svg{color:inherit}
.chip.plain{padding:0 16px}
.chip.add{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.filterbar{display:flex;align-items:center;gap:10px;margin-top:16px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--accent-soft)}
.filterbar span{flex:1;font-weight:650;font-size:14px;color:var(--accent-tx)}
.filterbar button{height:36px;padding:0 14px;border-radius:999px;background:var(--surface);font-weight:650;font-size:13px;box-shadow:var(--sh-1)}

/* storie in schede */
.feed{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px 14px;padding:14px 14px 8px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--edge),var(--sh-1);cursor:pointer;text-align:left}
.row .voices{grid-column:1 / -1}
.row .thumb{grid-column:2;grid-row:2 / span 2;width:92px;height:92px;border-radius:var(--r-md);overflow:hidden;align-self:start}
.row .hl{grid-column:1;font-size:16.5px;line-height:1.28;letter-spacing:-.012em}
.row .foot{grid-column:1 / -1}
.voices{display:flex;align-items:center;gap:9px;min-width:0}
.vnames{font-size:12.5px;color:var(--ink);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vnames em{font-style:normal;color:var(--ink-3);font-weight:550}
.time{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.hl{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.22;letter-spacing:-.015em;margin:0;text-wrap:pretty}
.dek{color:var(--ink-2);font-size:15px;line-height:1.45;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);min-height:36px}
.topic{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:999px;background:color-mix(in srgb,var(--tc) var(--tint),var(--surface));color:color-mix(in srgb,var(--tc) 78%,var(--ink));font-weight:650;font-size:12px;white-space:nowrap}
.topic svg{width:14px;height:14px}
/* numero e «testate» sulla stessa linea di base; l'icona, ritagliata al disegno, è centrata sull'altezza delle cifre (≈0,72 em) */
.cov{display:inline-flex;align-items:baseline;gap:5px;font-size:14px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.cov svg.i{width:.925em;height:.9em;flex:none;align-self:baseline;color:var(--accent-2);stroke-width:2;transform:translateY(.09em);overflow:visible}
.cov b{font-size:1em;font-weight:750;color:var(--ink);letter-spacing:-.01em}
.cov small{font-size:.893em;font-weight:550;color:var(--ink-3)}
.coverage-head .cov{font-size:16px}
.foot .sp{margin-left:auto}
.savebtn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2);background:var(--surface-2);flex:none;transition:background .2s,color .2s}
.savebtn svg{width:18px;height:18px}
.savebtn[aria-pressed="true"]{color:var(--accent-tx);background:var(--accent-soft)}
.savebtn[aria-pressed="true"] svg{fill:currentColor}
.nb{flex:none;height:21px;padding:0 9px;border-radius:999px;background:var(--mark);color:var(--mark-ink);font-size:11px;font-weight:750;display:inline-flex;align-items:center;margin-left:auto}
.nb+.time{margin-left:0}

/* storia in evidenza */
.feature{display:grid;gap:10px;padding:8px 8px 6px;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--edge),var(--sh-1);cursor:pointer;text-align:left;margin-bottom:10px}
.feature .cover{position:relative;border-radius:calc(var(--r-xl) - 8px);overflow:hidden;aspect-ratio:16/10}
.feature .cover .vpill{position:absolute;top:10px;left:10px;max-width:calc(100% - 20px)}
.feature .flag{justify-self:start;display:inline-flex;align-items:center;height:27px;padding:0 11px;margin:4px 8px 0;border-radius:999px;background:var(--mark-soft);color:var(--mark-tx);font-size:12.5px;font-weight:700}
.feature .hl,.feature .dek,.feature .foot{margin-inline:8px}
.feature .hl{font-size:23px;line-height:1.17;letter-spacing:-.018em}

/* dossier: foto con scheda e contatore */
.drail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px -10px;padding:2px 16px 26px}
.drail::-webkit-scrollbar{display:none}
.dcard{flex:none;position:relative;width:236px;height:238px;border-radius:var(--r-xl);overflow:hidden;background:var(--surface-2);box-shadow:var(--sh-1);text-align:left;isolation:isolate}
.dcard::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
.dcard .dart{position:absolute;inset:0}
.dcard .dart>svg,.dcard .dart>.vis{width:100%;height:100%}
.dcard .dchip{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 11px 0 8px;border-radius:999px;background:color-mix(in srgb,var(--tc) 16%,#FFFFFF);color:color-mix(in srgb,var(--tc) 82%,#000);font-size:12px;font-weight:700;box-shadow:0 4px 12px -6px rgba(0,0,0,.35)}
.dcard .dchip svg{width:14px;height:14px}
.dcard .din{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:flex-end;gap:10px;padding:12px 10px 12px 13px;border-radius:calc(var(--r-xl) - 8px);background:var(--surface);box-shadow:var(--edge),0 10px 24px -12px rgba(0,0,0,.45)}
.dcard .dtx{flex:1;min-width:0;display:grid;gap:4px}
.dcard strong{font-family:var(--display);font-weight:750;font-size:16px;line-height:1.2;letter-spacing:-.018em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .dtx span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .fol{color:var(--accent-tx);font-weight:650}
.dnum{flex:none;display:grid;justify-items:center;align-content:center;gap:2px;min-width:54px;height:54px;padding:0 8px;border-radius:15px;background:var(--accent-soft);color:var(--accent-tx)}
.dnum small{font-size:9.5px;font-weight:700;line-height:1;opacity:.85}
.dnum b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}

/* attesa e stati */
.sk{display:grid;grid-template-columns:1fr 92px;gap:10px 14px;padding:16px 14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--edge);margin-bottom:10px}
.sk i{display:block;height:12px;border-radius:6px;background:var(--surface-2)}
.sk i.h{height:20px}
.sk b{grid-column:2;grid-row:1 / span 4;height:92px;border-radius:var(--r-md);background:var(--surface-2)}
.skhero{height:calc(clamp(160px,46vw,198px) + 204px);border-radius:var(--r-xl);background:var(--surface-2);margin:16px 0 14px}
@media (prefers-reduced-motion:no-preference){.sk i,.sk b,.skhero{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}}
.state{margin-block:18px;padding:22px 20px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--edge),var(--sh-1)}
.state h3{margin:0 0 6px;font-family:var(--display);font-size:20px;font-weight:750;letter-spacing:-.024em;line-height:1.2}
.state p{margin:0;color:var(--ink-2)}
.state .btn{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15.5px;letter-spacing:-.012em;text-decoration:none;box-shadow:0 10px 22px -12px color-mix(in srgb,var(--accent) 90%,transparent)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.full{width:100%}
.btn svg{width:19px;height:19px}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}

/* tessere dei temi */
.ttiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ttile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:116px;padding:14px;border-radius:var(--r-lg);background:linear-gradient(150deg,color-mix(in srgb,var(--tc) var(--tint),var(--surface)) 0%,var(--surface) 78%);box-shadow:var(--edge),var(--sh-1);text-align:left;color:var(--ink);overflow:hidden;transition:box-shadow .2s,background .2s}
.ttile .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 20%,var(--surface));color:color-mix(in srgb,var(--tc) 88%,var(--ink))}
.ttile .ic svg{width:22px;height:22px}
.ttile strong{display:block;font-size:15px;font-weight:700;line-height:1.22;letter-spacing:-.015em}
.ttile small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
.ttile .ck{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 20%,transparent);display:grid;place-items:center;color:transparent;transition:background .2s}
.ttile .ck svg{width:14px;height:14px}
.ttile[aria-pressed="true"]{background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 30%,var(--surface)) 0%,color-mix(in srgb,var(--tc) 9%,var(--surface)) 85%);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tc) 85%,transparent),var(--sh-1)}
.ttile[aria-pressed="true"] .ck{background:var(--tc);box-shadow:none;color:#fff}
.ttile.nav .ck{display:none}
.ttile .tnum{position:absolute;top:12px;right:14px;display:grid;justify-items:end;line-height:1}
.ttile .tnum b{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--tc) 72%,var(--ink))}
.ttile .tnum small{margin-top:3px;font-size:11px;font-weight:600}

/* esplora */
.search{display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;border-radius:999px;background:var(--surface);box-shadow:var(--edge),var(--sh-2);margin-top:18px}
.search svg{width:21px;height:21px;color:var(--ink-3);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16.5px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink-3)}
.olist{display:grid;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--edge),var(--sh-1);padding-inline:14px}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding-block:11px;border-bottom:1px solid var(--line)}
.olist.pick .orow,.pick .orow{grid-template-columns:auto minmax(0,1fr) auto}
.orow:last-child{border-bottom:0}
.orow .oinfo{flex:1;min-width:0;text-align:left}
.orow .oinfo strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.012em}
.orow .oinfo span{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mutei{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);background:var(--surface-2);flex:none}
.mutei svg{width:18px;height:18px}
.mutei[aria-pressed="true"]{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.tog{height:36px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:650;color:var(--ink);background:var(--surface-2);flex:none;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tog.mute[aria-pressed="true"]{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.back{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 16px 0 10px;margin-top:8px;border-radius:999px;background:var(--surface);box-shadow:var(--edge),var(--sh-1);font-weight:650;color:var(--ink)}
.back svg{width:19px;height:19px}
.dhead{display:grid;gap:10px;padding-top:14px}
.dhead .dcover{height:172px;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-1)}
.dhead small{font-size:13.5px;font-weight:650;color:var(--accent-tx)}
.dhead h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.06;letter-spacing:-.022em;margin:0;text-wrap:balance}
.dhead p{margin:0;color:var(--ink-2);max-width:62ch}
.dhead .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h4.grp{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px;font-size:15px;font-weight:750;letter-spacing:-.015em;color:var(--ink)}
h4.grp span{font-size:13px;font-weight:550;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pick h4.grp:first-child{margin-top:4px}

/* selettore a pillole */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--surface-2);margin-top:18px}
.seg button{height:40px;border-radius:999px;font-weight:650;font-size:14px;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 10px -3px rgba(13,18,16,.22)}

/* profilo */
.pgroup{margin-top:28px}
.pgroup h3{margin:0 0 10px 4px;font-size:15px;font-weight:750;letter-spacing:-.015em;color:var(--ink)}
.pbox{padding:16px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--edge),var(--sh-1)}
.pbox a{color:var(--accent);font-weight:650}
.pbox .row2{display:flex;gap:10px;flex-wrap:wrap}
.pbox .row2 .btn{flex:1;min-width:120px;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3);font-weight:550}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.prose p{margin:0 0 10px;color:var(--ink-2);max-width:62ch}
.prose p:last-child{margin-bottom:0}
.hint{font-size:13px;color:var(--ink-3);margin:12px 4px 0}
.tinput{width:100%;height:50px;border-radius:999px;border:0;background:var(--surface-2);padding:0 18px;font:inherit;font-size:16px;color:var(--ink)}

/* barra delle sezioni, sospesa */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;align-items:flex-end;gap:8px;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
.tabs::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(100% + 26px);z-index:-1;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 88%,transparent) 62%);pointer-events:none}
.tbar{pointer-events:auto;flex:1;max-width:520px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--nav-h);padding:5px;border-radius:999px;background:var(--glass-bar);-webkit-backdrop-filter:saturate(1.8) blur(24px);backdrop-filter:saturate(1.8) blur(24px);box-shadow:inset 0 0 0 1px var(--glass-edge),var(--sh-float)}
.tbar button{display:grid;justify-items:center;align-content:center;gap:1px;min-width:0;border-radius:999px;font-size:10.5px;font-weight:650;letter-spacing:-.01em;color:var(--ink-2);white-space:nowrap;transition:background .25s,color .25s}
.tbar .ico{height:26px;display:grid;place-items:center}
.tbar svg{width:23px;height:23px}
.tbar button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-tx)}
.tbar button[aria-current="page"] svg{stroke-width:2.1}

/* lettore a voce */
.player{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);z-index:48;padding:0 12px}
.player .in{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px;border-radius:24px;background:color-mix(in srgb,var(--ink) 94%,transparent);color:var(--bg);box-shadow:var(--sh-float);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.player .pth{width:44px;height:44px;border-radius:16px;overflow:hidden;flex:none}
.player .txt{flex:1;min-width:0}
.player small{display:block;font-size:11.5px;font-weight:600;opacity:.65}
.player strong{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player button{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;flex:none}
.player button:hover{background:rgba(127,127,127,.2)}
.player svg{width:20px;height:20px}
body.flow-on .player{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}

/* storia aperta */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:no-preference){.sheet.enter{animation:rise .38s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{transform:translateY(36px);opacity:0}}}
.prog{position:sticky;top:0;z-index:4;height:3px;margin-bottom:-3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transform-origin:0 50%;transform:scaleX(0)}
.sbar{position:sticky;top:0;z-index:3;padding-top:env(safe-area-inset-top,0px);margin-bottom:calc(-60px - env(safe-area-inset-top,0px));transition:background .25s,box-shadow .25s}
.sbar.solid{background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(22px);backdrop-filter:saturate(1.8) blur(22px);box-shadow:0 1px 0 var(--line)}
.sbar .wrap{display:flex;align-items:center;gap:8px;height:60px;padding-inline:12px}
.sbar .grow{flex:1}
.sbar .iconbtn{width:40px;height:40px;border-radius:50%;background:var(--glass-2);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:var(--ink);box-shadow:inset 0 0 0 1px var(--glass-edge),var(--sh-1)}
.sbar .iconbtn svg{width:19px;height:19px}
.sbar .savebtn[aria-pressed="true"]{color:var(--accent-tx)}
.sbar .savebtn[aria-pressed="true"] svg{fill:currentColor}
.scover{position:relative;height:clamp(240px,42vh,370px);max-width:900px;margin:0 auto}
.scover>.vis,.scover>svg{position:absolute;inset:0;width:100%;height:100%}
.sin{position:relative;margin-top:-34px;background:var(--bg);border-radius:32px 32px 0 0;padding-block:10px 150px;box-shadow:0 -14px 30px -24px rgba(0,0,0,.45)}
.sin::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 16%,transparent);margin:0 auto}
.coverage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px}
.coverage-head small{font-size:14px;font-weight:650;color:var(--ink-2);letter-spacing:-.01em}
.ostrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px -14px;padding:10px 16px 24px}
.ostrip::-webkit-scrollbar{display:none}
.ochip{flex:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px 0 5px;border-radius:999px;background:var(--surface);box-shadow:var(--edge),var(--sh-1);white-space:nowrap;font-weight:650;font-size:13.5px;color:var(--ink);text-decoration:none}
.ochip .mono{width:32px;height:32px;line-height:32px;box-shadow:none}
.s-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:var(--ink-3);font-weight:550}
.s-hl{font-family:var(--display);font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.022em;margin:12px 0 0;text-wrap:balance}
.s-dek{font-family:var(--sans);font-size:18px;line-height:1.45;color:var(--ink-2);margin:12px 0 0;font-weight:450;letter-spacing:-.012em}
.s-body{margin-top:22px}
.s-body p{font-size:var(--read);line-height:1.62;margin:0 0 16px;max-width:65ch;letter-spacing:-.008em}
.blk{margin-top:32px}
.blk>h3{margin:0 0 12px 2px;font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.kp{margin:0;padding:4px 16px;list-style:none;display:grid;counter-reset:kp;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--edge),var(--sh-1)}
.kp li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding-block:13px;border-bottom:1px solid var(--line);font-size:calc(var(--read) - 1.5px);line-height:1.5;counter-increment:kp}
.kp li:last-child{border-bottom:0}
.kp li::before{content:counter(kp);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-tx);font-size:13px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.why{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-lg);background:var(--mark-soft)}
.why .wi{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--mark);color:var(--mark-ink)}
.why .wi svg{width:19px;height:19px}
.why p{margin:0;font-size:16px;line-height:1.5;color:var(--ink);font-weight:500}
.src{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--edge),var(--sh-1)}
.srow .who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
.srow .who time{margin-left:auto;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px}
.srow q{display:block;font-family:var(--display);font-weight:650;font-size:16.5px;line-height:1.34;letter-spacing:-.016em;margin-top:5px;quotes:"«" "»"}
.srow a{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;margin-top:12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:650;color:var(--ink);text-decoration:none}
.srow a svg{width:15px;height:15px}
.lang{flex:none;font-size:10px;font-weight:750;letter-spacing:.04em;padding:3px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.srow .who .lang{margin-left:0}
.srow .by{font-size:12px;color:var(--ink-3);margin-top:4px}
.srow .orig{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.srow .orig span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--ink-3)}
.srow .orig span svg{width:14px;height:14px}
.srow .orig q{font-family:var(--sans);font-size:14.5px;font-weight:450;margin-top:3px;color:var(--ink-2);letter-spacing:-.006em}
.srow .orig.pend span{font-weight:600}
.nextcard{display:grid;grid-template-columns:1fr 80px;gap:14px;align-items:center;width:100%;padding:16px;border-radius:var(--r-xl);background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,#14A58E 55%,#0B0F0E) 0%,#0B0F0E 70%);color:#F2F6F4;text-align:left;margin-top:32px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),var(--sh-2)}
.nextcard small{display:block;font-size:12.5px;font-weight:600;opacity:.7}
.nextcard strong{display:block;font-family:var(--display);font-weight:750;font-size:18px;line-height:1.22;letter-spacing:-.02em;margin-top:4px}
.nextcard .nth{width:80px;height:80px;border-radius:18px;overflow:hidden}
.credit{position:absolute;left:14px;bottom:46px;z-index:1;height:28px;padding:0 11px;border-radius:999px;background:rgba(12,14,14,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;font-size:11.5px;font-weight:650;display:inline-flex;align-items:center}
.mapbox{height:220px;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--edge),var(--sh-1)}

.sdock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:4px;max-width:calc(100% - 32px);padding:6px;border-radius:999px;background:var(--glass-bar);-webkit-backdrop-filter:saturate(1.8) blur(24px);backdrop-filter:saturate(1.8) blur(24px);box-shadow:inset 0 0 0 1px var(--glass-edge),var(--sh-float)}
.sdock .dk{flex:none;height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.sdock .dk svg{width:21px;height:21px;flex:none}
.sdock .dk.main{flex:0 1 auto;min-width:0;padding:0 20px 0 16px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px -10px color-mix(in srgb,var(--accent) 90%,transparent)}
.sdock .dk.main span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdock .savebtn{width:48px;height:48px;background:transparent;color:var(--ink)}
.sdock .savebtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-tx)}
body.locked:not(.flow-on) .player{z-index:55;bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}

/* sfoglia: schermate scure tinte dal tema */
.flow{position:fixed;inset:0;z-index:45;background:#07090A;color:#F2F6F4}
.flow .track{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.flow .track::-webkit-scrollbar{display:none}
.slide{--tc:#14A58E;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 20px);background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--tc) 46%,transparent) 0%,transparent 72%),linear-gradient(180deg,color-mix(in srgb,var(--tc) 20%,#07090A) 0%,#07090A 72%)}
.slide .vtop{--ring:rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;padding-right:128px;min-height:42px}
.slide .vtop .vn{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.slide .vtop .vn em{font-style:normal;opacity:.6}
