<title>Eddy</title>
<style>
/* Eddy · fondamenta del design definitivo: carattere Schibsted Grotesk servito dal sito, solo tema chiaro */
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/schibsted-grotesk-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/schibsted-grotesk-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  /* colori */
  --ink:#111216;          /* inchiostro */
  --ink-2:#6B6E76;        /* grigio testo */
  --ink-3:#9A9DA5;        /* grigio chiaro */
  --ink-soft:#5A5D66;     /* righe secondarie (data, conteggi) */
  --line:#E1E3E7;         /* bordi */
  --line-2:#E4E5E9;       /* bordo della barra e dei pulsanti tondi */
  --card:#FFFFFF;
  --pill:#EEEFF2;         /* voce attiva, pulsanti tenui */
  --ph:#DADCE1;           /* posto della foto che non c'è ancora */
  --bg:#FFFFFF;           /* fondo di tutte le pagine */
  --soft:#F4F5F7;         /* grigio delle parti interne (anteprime, segnaposto) */
  /* raggi */
  --r-card:16px;
  --r-sm:14px;
  --r-ph:10px;
  --r-tag:6px;
  /* ombre */
  --sh-card:0 1px 2px rgba(10,15,30,.04);
  --sh-lift:0 12px 30px rgba(10,15,30,.09);
  --sh-nav:0 8px 24px rgba(10,15,30,.08);
  /* colore del nome nel saluto, cambia con l'ora (la imposta app.js con data-light) */
  --name:#B0502A;
  --font:'Schibsted Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --map-sea:#DCE7F0;--map-land:#FAFAFB;--map-line:#B9BEC8;--map-hl:#D7DEEF;--map-grid:rgba(17,18,22,.06);
  --read:17px;
  --nav-h:68px;
  /* distanza della barra dal fondo: 16px come nel riferimento; sull'iPhone con l'indicatore home circa 22px dal bordo fisico */
  --nav-gap:max(16px, calc(env(safe-area-inset-bottom,0px) - 12px));
  color-scheme:light;
}
:root[data-light="pomeriggio"]{--name:#2F6496}
:root[data-light="sera"]{--name:#5B4CA0}
*{box-sizing:border-box}
/* tutto bianco: nessuno stacco con la zona dell'ora dell'iPhone, né in cima né in fondo */
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;letter-spacing:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility;overflow-x:clip;padding-bottom:calc(var(--nav-h) + var(--nav-gap) + 24px)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
.pane{max-width:680px;margin:0 auto;padding-inline:16px;background:var(--bg)}
.pane.sf-pane{max-width:none;min-height:100vh;min-height:100dvh;background:#14151A}
body.sf-on{padding-bottom:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
.art{display:block;width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .36s cubic-bezier(.3,.7,.4,1)}
@keyframes pop{45%{transform:scale(1.3)}}}
/* Oggi: logo e aggiornamento affiancati, poi saluto compatto e data. */
.ohead{text-align:left;padding:calc(env(safe-area-inset-top,0px) + 14px) 4px 0}
.otop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:19px;line-height:1;letter-spacing:-.03em;color:var(--ink);flex:none}
.logo svg{width:23px;height:17px;flex:none}
.greet{margin:16px 0 0;font-weight:800;font-size:27px;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.greet em{font-style:normal;color:var(--name)}
.odate{margin:6px 0 0;font-size:14px;font-weight:500;color:var(--ink-soft)}
.rb{position:relative;height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border-radius:20px;background:var(--soft);color:var(--ink-soft);font-size:12.5px;font-weight:600;white-space:nowrap}
.rb::before{content:"";position:absolute;inset:-2px 0}
.rb svg{width:16px;height:16px;flex:none}
.rb.spin svg{animation:spin 1.1s linear infinite}
/* titoli di sezione */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 4px 12px}
.sec h2{margin:0;font-weight:800;font-size:24px;line-height:1;letter-spacing:-.01em}
.sec span,.sec .lnk{font-size:13px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec .lnk{min-height:44px;margin:-14px -6px -14px 0;padding:0 6px}
/* Prima pagina e notizie nuove: card affiancate, scorrimento del browser. */
.car-sec h2{font-size:22px}
.ohead + .car-sec{margin-top:30px}
.carousel{display:flex;align-items:stretch;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 20px 18px;scroll-snap-type:x mandatory;scroll-padding-inline:20px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.ccard{flex:0 0 calc(100% - 32px);max-width:360px;scroll-snap-align:start;display:flex;flex-direction:column;border:1px solid var(--line);border-top:6px solid var(--tg);border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 10px 26px rgba(10,15,30,.08);cursor:pointer;color:var(--ink);outline-offset:-3px}
.cpic{position:relative;height:196px;flex:none;overflow:hidden;background:var(--ph)}
.cpic .vis{background:var(--ph)}
.cpic .vis .pcred{top:10px;right:10px}
.ccard img{-webkit-user-drag:none;user-select:none}
.ccard .cin{display:flex;flex-direction:column;flex:1;padding:14px 16px 16px}
.tag{align-self:flex-start;display:inline-flex;align-items:center;background:var(--tgt,var(--tg));color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:var(--r-tag);line-height:1.2}
.ccard h3{margin:10px 0 0;font-size:23px;line-height:1.12;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.ccard h3.compact{font-size:21px}
.oggi-car .cpic{height:180px}
.oggi-car .ccard h3{font-size:22px}
.ccard .meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.ccard .cov{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:14px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;white-space:nowrap}
.ccard .cov svg{width:14px;height:14px}
.carousel .vis>.ph{transition:opacity .15s ease}
.carousel + .sr + .sec{margin-top:14px}
.oggi-sep{height:0;margin:4px 4px 0;border:0;border-top:1px solid #ECEDF0}
.oggi-sep + .sec{margin-top:22px}
.oggi-sep + .sec h2{font-size:22px}
.car-hint{margin:-4px 4px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
/* elenchi di storie */
.nlist{margin:0 -4px;padding:4px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:14px;padding:14px 0;border-top:1px solid #E3E3E3;cursor:pointer;color:var(--ink)}
.nrow:first-child{border-top:0}
.nrow .th{width:76px;height:76px;border-radius:var(--r-tag);overflow:hidden;background:var(--ph)}
.kick{display:block;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.nrow h3{margin:5px 0 0;font-weight:800;font-size:18px;line-height:1.16;letter-spacing:-.005em;text-wrap:pretty}
.nwhy{display:block;font-size:12.5px;font-weight:600;color:var(--ink-3);line-height:1.3}
/* testata delle pagine (Per te, Salvati, Profilo) */
.phead{text-align:center;padding:calc(env(safe-area-inset-top,0px) + 22px) 4px 0}
.phead h1{margin:0;font-weight:800;font-size:31px;line-height:1.05;letter-spacing:-.02em}
.psub{display:block;margin-top:6px;font-size:14px;line-height:1.3;font-weight:500;color:var(--ink-soft)}
.psub b{color:var(--ink);font-weight:600}
/* salvati: schede, cartelle per tema, recenti per giorno */
.stabs{display:flex;justify-content:center;gap:22px;margin:14px 0 0}
.stabs button{position:relative;min-height:44px;font-size:15px;font-weight:700;color:var(--ink-3)}
.stabs button[aria-selected="true"]{color:var(--ink)}
.stabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:2.5px;border-radius:2px;background:var(--ink)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px -4px 0}
.fd{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--tg);border-radius:var(--r-sm);overflow:hidden;color:var(--ink);text-align:left}
.fd.all{grid-column:1 / 3}
.mo{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:3px;height:92px;padding:8px 8px 0;box-sizing:content-box}
.mo.m1{grid-template-columns:1fr}
.mo.m2{grid-template-columns:1fr 1fr}
.mo.m3>i:first-child{grid-row:span 2}
.fd.all .mo{grid-template-columns:repeat(4,1fr);height:84px}
.mo i{display:block;min-height:0;border-radius:6px;overflow:hidden;background:#C9CCD3}
.fd.void .mo i{background:#F0F1F3}
.fi{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px 12px;line-height:1.25}
.fi b{font-size:16px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi span{font-size:13px;font-weight:700;color:var(--ink-3)}
.fd.void b{color:var(--ink-3)}
.fnote{margin:14px 8px 0;text-align:center;font-size:13px;color:var(--ink-3)}
.day{margin:20px 4px 8px;font-size:12.5px;line-height:1.2;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.nv{display:inline-flex;font-size:12px;font-weight:800;color:var(--ink);background:var(--pill);padding:3px 8px;border-radius:999px}
.bk{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;min-height:44px;margin:calc(env(safe-area-inset-top,0px) + 14px) 0 0;padding-right:10px;font-size:15px;font-weight:700;color:var(--ink)}
.bk svg{width:20px;height:20px}
.bk.fbk{margin-top:calc(env(safe-area-inset-top,0px) + 6px)}
.fhead{padding-top:6px;margin-top:-12px}
.ftop{margin-top:18px;border-top:5px solid var(--tg)}
/* profilo */
.who{padding-top:calc(env(safe-area-inset-top,0px) + 44px)}
.nm{display:inline-flex;align-items:center;gap:8px}
.nm h1{margin:0}
.nm .pen{margin-block:-5px}
.nm h1.noname{color:var(--ink-3)}
.pen{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink-2);position:relative}
.pen::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card);border:1px solid var(--line);z-index:-1}
.pen{isolation:isolate}
.nameinp{width:min(100%,320px);height:52px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);font:inherit;font-size:22px;font-weight:800;text-align:center;color:var(--ink)}
.card2{margin:26px -4px 0;padding:18px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.ch2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch2 b{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ch2 span{font-size:13.5px;font-weight:700;color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.three div{border-radius:var(--r-sm);background:var(--soft);padding:16px 12px;border-top:4px solid var(--c);min-width:0}
.three b{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--ct,var(--c));line-height:1.1}
.three span{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-top:4px;overflow-wrap:anywhere}
.hint0{margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--ink-2)}
.grp{margin:26px -4px 0}
.gl{margin:0 8px 8px;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.bx{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:0 16px}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;border-top:1px solid #ECEDF0;color:var(--ink);text-align:left}
.it:first-child{border-top:0}
.it b{font-size:16px;font-weight:700}
.it svg{width:18px;height:18px;flex:none}
.it .r{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:14px;font-weight:600}
.tdots{display:flex;gap:3px}
.tdots i{display:block;width:8px;height:8px;border-radius:2px}
.plain{margin:22px -4px 0;padding:0 16px}
.plain .it{border-top-color:var(--line-2)}
.again{display:flex;justify-content:center;align-items:center;width:100%;margin:26px 0 0;min-height:44px;font-size:15px;font-weight:700;color:var(--ink)}
.del{display:flex;justify-content:center;align-items:center;width:100%;min-height:44px;font-size:14px;font-weight:700;color:#B4232A}
.made{margin:2px 0 0;text-align:center;font-size:12.5px;color:var(--ink-3)}
/* pannello dal basso */
.panel{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(17,18,22,.38)}
@media (prefers-reduced-motion:no-preference){.psheet{animation:sheetup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}}}
.psheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;max-height:calc(100% - 40px);margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box;padding:10px 16px calc(var(--nav-gap) + 12px);background:var(--card);border-radius:22px 22px 0 0}
.grab{flex:none;width:40px;height:5px;border-radius:3px;background:#D5D7DD;margin:0 auto 14px}
.psheet h2{margin:0 4px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:4px 4px 16px;margin:0 -4px}
.plede{margin:6px 0 14px;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.fams{margin:4px 0 14px}
.fml{margin:14px 0 7px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.fml:first-child{margin-top:0}
.tpls{display:flex;flex-wrap:wrap;gap:7px}
.tpl{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 13px 0 11px;border-radius:22px;border:1.5px solid #D9DBE0;background:var(--card);font-size:15px;font-weight:800;letter-spacing:-.005em;white-space:nowrap;color:#3A3C42;transition:background .18s,border-color .18s,color .18s,box-shadow .18s}
.tpl svg{flex:none;color:var(--tx)}
.tpl[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on);box-shadow:0 6px 14px rgba(10,15,30,.10)}
.tpl[aria-pressed="true"] svg{color:var(--on)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:0 16px;border-radius:12px;border:1px solid var(--line);font-weight:700;color:var(--ink)}
.opt[aria-checked="true"]{background:#F1F2F5;border-color:var(--ink)}
.done{flex:none;min-height:54px;border-radius:27px;background:var(--ink);color:#fff;font-size:16px;font-weight:800}
.btnp{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:16px;border-radius:999px;border:1.5px solid var(--ink);font-weight:800;color:var(--ink)}
.btn2{display:inline-flex;align-items:center;justify-content:center;flex:1;min-height:48px;padding:0 18px;border-radius:999px;background:var(--pill);font-weight:700;color:var(--ink);cursor:pointer}
.psheet .row2{display:flex;gap:10px;margin:4px 0 12px}
.psheet .prose p{margin:0 0 12px;font-size:15.5px;line-height:1.5;color:#2B2D33}
.psheet .prose a{color:var(--ink);font-weight:700}
.psheet .kv{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.psheet .kv dt{color:var(--ink-2);font-weight:600}
.psheet .kv dd{margin:0}
/* per te: i tuoi temi, un mazzo per tema */
.sec.tsec{margin-top:24px}
.sec.tsec h2{font-size:22px}
.mz{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin:6px 0 0}
.tdk{display:block;min-width:0;text-align:left;color:var(--ink);border-radius:12px;outline-offset:4px}
.tst{position:relative;display:block;height:186px;margin-top:10px}
.tst i{position:absolute;inset:0;border-radius:12px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);transform-origin:50% 0}
.tst .b2{transform:translateY(-10px) scale(.88);opacity:.55}
.tst .b1{transform:translateY(-5px) scale(.94);opacity:.8}
.tcd{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(10,15,30,.08)}
.tcd .pic{position:relative;display:block;flex:none;height:92px;margin:6px 6px 0;border-radius:7px;overflow:hidden;background:#C3C7CF}
.tcd .pic .vis .pcred{top:auto;right:5px;bottom:5px;padding:2px 6px}
.tcd .h{margin:8px 10px 0;font-size:13.5px;line-height:1.22;font-weight:800;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcd .h.nada{color:var(--ink-3)}
.nw{position:absolute;right:-6px;top:-14px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:4px 9px;border-radius:12px;white-space:nowrap}
.lb{display:flex;align-items:center;gap:6px;margin-top:10px;min-height:20px;line-height:1.25}
.lb svg{color:var(--tx);flex:none}
.lb b{font-size:16px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb small{margin-left:auto;font-size:13px;color:var(--ink-3);font-weight:700}
.ot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 -4px}
.otp{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;color:var(--ink)}
.otp svg{color:var(--tx);flex:none}
.otp b{font-size:14.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otp small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.empty .cta{margin-top:16px}
/* pagina di un tema */
.thh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:calc(env(safe-area-inset-top,0px) + 14px) -4px 0}
.thh .bk{margin:0;padding:0 10px 0 4px}
.tmine{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;background:rgba(255,255,255,.75);font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.tmine svg{width:16px;height:16px;flex:none}
.tti{text-align:center;padding:2px 4px 0}
.tti h1{margin:6px 0 0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tti h1 svg{display:block;flex:none}
.tti p{margin:6px 0 0;font-size:14px;line-height:1.3;color:var(--ink-soft)}
.tti p b{color:var(--ink)}
.tnone{margin:28px 4px 0;text-align:center;font-size:14px;font-weight:600;color:var(--ink-2)}
.sec.tall{margin-top:28px}
.empty{margin:24px -4px 0;padding:26px 22px;text-align:center;background:var(--card);border:1px dashed #C9CCD3;border-radius:18px}
.empty .eico{width:56px;height:56px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pill);color:var(--ink)}
.empty .eico svg{width:26px;height:26px}
.empty h3{margin:12px 0 0;font-size:22px;font-weight:800;line-height:1.15}
.empty p{margin:8px 0 0;font-size:15px;line-height:1.45;color:#4A4D55}
.rm{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:8px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.rm b{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:700;white-space:nowrap}
.rm b svg{width:13px;height:13px}
/* attesa e stati */
.sk{display:grid;grid-template-columns:1fr 92px;gap:10px 14px;padding:16px 14px;border-radius:var(--r-card);background:var(--card);box-shadow:0 0 0 1px var(--line);margin-bottom:10px}
.sk i{display:block;height:12px;border-radius:6px;background:var(--pill)}
.sk i.h{height:20px}
.sk b{grid-column:2;grid-row:1 / span 4;height:92px;border-radius:var(--r-sm);background:var(--pill)}
.skhero{height:calc(clamp(160px,46vw,198px) + 204px);border-radius:var(--r-card);background:var(--pill);margin:16px 0 14px}
@media (prefers-reduced-motion:no-preference){.sk i,.sk b,.skhero{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}}
.state{margin-block:18px;padding:22px 20px;border-radius:var(--r-card);background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh-card)}
.state h3{margin:0 0 6px;font-family:var(--font);font-size:20px;font-weight:750;letter-spacing:-.024em;line-height:1.2}
.state p{margin:0;color:var(--ink-2)}
.state .btn{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;text-decoration:none}
.btn svg{width:19px;height:19px}
/* testi e dati nel pannello */
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3);font-weight:550}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.prose p{margin:0 0 10px;color:var(--ink-2);max-width:62ch}
.prose p:last-child{margin-bottom:0}
/* barra di navigazione: pillola bianca che fluttua, solo icone; la voce attiva si allarga con il nome */
.tabs{position:fixed;left:14px;right:14px;bottom:var(--nav-gap);z-index:30;max-width:520px;height:var(--nav-h);margin:0 auto;padding:0 10px;display:flex;justify-content:space-between;align-items:center;border-radius:34px;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--sh-nav);box-sizing:border-box;transition:background .25s,border-color .25s,box-shadow .25s}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;min-width:48px;height:48px;padding:0;border-radius:24px;color:var(--ink-2);font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;transition:color .25s}
.tabs button svg{width:23px;height:23px;flex:none;transition:transform 250ms cubic-bezier(.34,1.56,.64,1);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button span{display:none;transform-origin:0 50%}
.tabs button.press svg{transform:scale(.9);transition-duration:90ms}
/* la pillola della voce attiva è un solo indicatore che scivola: due mezzi cerchi e una striscia che si allunga (solo transform) */
.tind{position:absolute;left:0;top:50%;height:48px;margin-top:-24px;pointer-events:none;transition:opacity .25s}
.tind i{position:absolute;top:0;height:48px;background:var(--pill)}
.tind .ta,.tind .tb{left:0;width:48px;border-radius:24px}
.tind .tm{left:24px;width:1px;transform-origin:0 50%}
.tlab{position:absolute;z-index:1;top:50%;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;pointer-events:none;transform-origin:0 50%}
.tabs button[aria-current="page"]{padding:0 18px;color:var(--ink)}
.tabs button[aria-current="page"] span{display:inline}
/* in Sfoglia la barra riprende il foglio scuro */
body.sf-on .tabs{background:rgba(28,29,34,.72);border-color:rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
body.sf-on .tabs button{color:#A3A6AD}
body.sf-on .tabs button[aria-current="page"],body.sf-on .tlab{color:#FFFFFF}
body.sf-on .tind{opacity:.12}
body.sf-on .tind i{background:#FFFFFF}
/* storia aperta */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 13px) 8px 0;background:linear-gradient(var(--tg),var(--tg)) top/100% calc(env(safe-area-inset-top,0px) + 5px) no-repeat,rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sbar .grow{flex:1}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink);background:transparent;flex:none}
.ib svg{width:22px;height:22px}
.ib.savebtn[aria-pressed="true"] svg{fill:currentColor}
.story{max-width:680px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.swrap{padding:0 22px}
.story .k{display:block;margin-top:6px;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.story .tt{margin:8px 0 0;font-size:27px;line-height:1.1;font-weight:800;letter-spacing:-.01em;color:var(--ink);text-wrap:pretty}
.story .by{margin:10px 0 0;font-size:13.5px;color:var(--ink-2);font-weight:600;line-height:1.4}
.story .by b{color:var(--ink)}
.sph{position:relative;margin:18px 22px 0;height:210px;border-radius:var(--r-sm);overflow:hidden;background:#B8BCC6}
.sph .vis .pcred{top:auto;bottom:10px;right:10px}
.lab{margin:28px 0 10px;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.story .p{margin:0 0 14px;font-size:var(--read);line-height:1.55;color:#1E2025}
.story .p small{display:block;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--ink-3);line-height:1.3}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm)}
.crono{padding:6px 16px}
.cr2{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:8px 0;border-top:1px solid #ECEDF0;font-size:15px;line-height:1.35;color:#1E2025;text-decoration:none;min-height:44px}
.cr2:first-child{border-top:0}
.cr2>span:first-child{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.35}
.cr2 em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.fo{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:46px;border-top:1px solid #ECEDF0;font-size:14px;font-weight:700;color:var(--ink);text-align:left}
.fo span{display:flex;color:var(--ink-3)}
.fo svg,.ch>svg{width:18px;height:18px;flex:none}
.fo[aria-expanded="true"] svg{transform:rotate(-90deg)}
.chs{overflow:hidden}
.chd+.chd{border-top:1px solid #ECEDF0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:0 16px;color:var(--ink);cursor:pointer;list-style:none}
.ch::-webkit-details-marker{display:none}
.ch>span{min-width:0}
.ch b{display:block;font-size:16px;font-weight:800}
.ch small{display:block;font-size:13px;color:var(--ink-2);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch>svg{transition:transform .2s}
.chd[open]>.ch>svg{transform:rotate(90deg)}
.chb{padding:2px 16px 16px}
.pts{list-style:none;margin:0;padding:0}
.pt{display:grid;grid-template-columns:18px 1fr;gap:8px;margin:0 0 12px;font-size:16px;line-height:1.45;color:#1E2025}
.pt::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tg);margin:9px 0 0 4px}
.pt small{display:block;margin-top:2px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.vo{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-top:1px solid #ECEDF0}
.vo:first-child{border-top:0}
.bo{width:34px;height:34px;border-radius:50%;background:var(--pill);color:var(--ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.vo p{margin:0;font-size:16px;line-height:1.5;color:#1E2025}
.vo b{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;color:var(--ink);margin-bottom:3px}
.vo b time{font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vo .orig{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14px;color:var(--ink-2)}
.vo .orig span{display:block;font-size:12px;font-weight:700;color:var(--ink-3)}
.vo .orig q{quotes:none}
.vo .aut{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-3)}
.chb .cmpu,.chb .agl{padding:0;background:none;box-shadow:none;border-radius:0}
.chb .agl{margin:0 0 4px;padding-bottom:10px;border-bottom:1px solid #ECEDF0}
.chb .cmpu li{border-color:#ECEDF0}
.sact a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:999px;background:var(--pill);font-size:13px;font-weight:700;color:var(--ink);text-decoration:none}
.sact a svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
/* Sfoglia: un'unica superficie scura #14151A, piatta, da bordo a bordo (sotto la barra di stato e sotto la barra di navigazione);
   html e body prendono lo stesso colore, così anche il rimbalzo è scuro. Entrando e uscendo il fondo sfuma in circa 200 ms. */
html,body{transition:background-color .2s ease}
html.sf-chrome,html.sf-chrome body{background:#14151A}
.sfshell{position:fixed;inset:0;z-index:1;overflow:hidden;background:#14151A;color-scheme:dark;animation:sfIn .2s ease both}
@keyframes sfIn{from{opacity:0}}
.sfv{position:absolute;inset:0;z-index:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;background:transparent;-webkit-overflow-scrolling:touch}
.sfv::-webkit-scrollbar{display:none}
.sf{height:100%;scroll-snap-align:start;scroll-snap-stop:always;box-sizing:border-box;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(var(--nav-h) + var(--nav-gap) + 26px);cursor:pointer;color:#FFFFFF;outline-offset:-4px;background:transparent}
.sf:focus-visible{outline-color:#FFFFFF}
.sfph{position:relative;flex:0 1 310px;min-height:100px;border-radius:var(--r-sm);overflow:hidden;background:#3A3C44;box-shadow:0 18px 40px rgba(0,0,0,.45)}
/* la foto riempie la cornice per posizione: Safari non sempre calcola height:100% dentro una colonna flessibile (la foto risultava alta 0) */
.sfph>.vis{position:absolute;inset:0;width:auto;height:auto}
.sfph .vis .pcred{top:auto;right:10px;bottom:10px;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.6)}
.sftx{flex:none;margin-top:22px}
.sf .m2{margin:0;font-size:13.5px;color:#A3A6AD;font-weight:600}
.sf .m2 span{font-weight:800;color:var(--sf-topic,#D6D8DE)}
.sf h2{margin:8px 0 0;font-size:25px;line-height:1.13;font-weight:800;letter-spacing:-.01em;text-wrap:pretty;overflow-wrap:anywhere}
.sf .q{margin:16px 0 0;padding-left:13px;border-left:3px solid var(--tg);font-size:16px;line-height:1.5;color:#D6D8DE}
.sf .qt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sf .qo{display:block;margin-top:5px;font-size:12.5px;font-weight:700;color:#A3A6AD}
.sf .qo a{display:inline-flex;align-items:center;min-height:44px;margin:-8px 0;position:relative;text-underline-offset:3px}
.sf .qo a:focus-visible{outline-color:#FFFFFF}
@media (max-height:700px){.sf h2{font-size:22px}
.sf .qt{-webkit-line-clamp:2}}
@media (max-height:550px){.sf{padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(var(--nav-h) + var(--nav-gap) + 12px)}
.sfph{min-height:60px}.sftx{margin-top:14px}.sf h2{font-size:20px}.sf .q{margin-top:10px}.sf .qt{-webkit-line-clamp:1}}
/* primo avvio */
.onb{position:fixed;inset:0;z-index:60;overflow-y:auto;background:var(--bg)}
.ob{min-height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 22px calc(var(--nav-gap) + 10px)}
.obt{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.steps{display:flex;gap:6px}
.steps i{display:block;width:26px;height:4px;border-radius:2px;background:#D9DBE0}
.steps i.on{background:var(--ink)}
.skip{min-height:44px;padding-left:12px;font-size:15px;font-weight:700;color:var(--ink-2)}
.ob h1{margin:0;font-size:36px;line-height:1.04;font-weight:800;letter-spacing:-.02em;color:var(--ink);outline:none}
.ob h1 em{font-style:normal;color:var(--name)}
.ob h1.oh2{margin-top:18px;font-size:32px}
.obx{margin-top:28px}
.olead{margin:14px 0 0;font-size:17px;line-height:1.5;color:#3A3C42}
.olead.sm{margin-top:8px;font-size:15px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;margin-top:auto;border-radius:28px;background:var(--ink);color:#fff;font-size:16px;font-weight:800}
.opreview{display:flex;gap:12px;overflow:hidden;min-height:220px;margin:20px 0 0;padding:4px 0 16px}
.opreview .sc{position:relative;flex:0 0 82%;height:190px;background:var(--card);border:1px solid var(--line);border-top:5px solid;border-radius:16px;box-shadow:0 10px 26px rgba(10,15,30,.07)}
.opreview .p{position:absolute;left:12px;right:12px;top:12px;height:70px;border-radius:8px;background:#D3D6DC}
.opreview .l1,.opreview .l2,.opreview .l3{position:absolute;left:12px;height:12px;border-radius:6px;background:#2B2D33}
.opreview .l1{top:96px;width:70%}
.opreview .l2{top:116px;width:50%}
.opreview .l3{top:142px;width:36%;height:8px;border-radius:4px;background:#C9CCD3}
.otg{margin-top:16px;padding-bottom:16px}
.ob.fixh{height:100%;min-height:0}
.ob.fixh .otg{flex:1;min-height:0;overflow-y:auto;margin-right:-22px;padding-right:22px;padding-top:2px}
.ob.fixh .fams{margin-top:0}
.obot{position:sticky;bottom:0;margin-top:auto;padding:12px 0 0;background:linear-gradient(180deg,rgba(255,255,255,0),var(--bg) 12px)}
.obot .cta{margin-top:0}
.oinp{width:100%;min-height:60px;margin-top:22px;padding:0 18px;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);font:inherit;font-size:22px;font-weight:700;color:var(--ink)}
.oprev{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--soft);text-align:center}
.oprev small{display:block;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.oprev b{display:block;margin-top:6px;font-size:24px;font-weight:800}
.oprev b em{font-style:normal;color:var(--name)}
/* foto e mappe */
.vis{position:relative;display:block;width:100%;height:100%;overflow:hidden;background:var(--pill)}
.vis .pcred{position:absolute;right:12px;top:12px;z-index:1;max-width:75%;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.vis.k-band .pcred{top:auto;bottom:8px}
.vis>.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* foto non ancora arrivata: resta il segnaposto fermo; quando è pronta compare con una dissolvenza brevissima */
.vis>.ph{transition:opacity .12s ease}
.vis>.ph.ld{opacity:0}
.vis>svg{position:absolute;inset:0}
.map .msea{fill:var(--map-sea)}
.map .mgr{fill:none;stroke:var(--map-grid)}
.map .mland{fill:var(--map-land);stroke:var(--map-line);stroke-linejoin:round}
.map .mhl{fill:var(--map-hl);stroke:var(--ink);stroke-linejoin:round}
.map .mhalo{fill:var(--ink);opacity:.2}
.map .mpt{fill:var(--ink);stroke:#fff}
.map text{fill:var(--ink);font-family:var(--font);font-weight:750;paint-order:stroke;stroke:var(--map-land);stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){@keyframes halo{0%{transform:scale(.4);opacity:.45}100%{transform:scale(1.4);opacity:0}}}
/* aggiornamento */
@keyframes spin{to{transform:rotate(360deg)}}
.more{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin:12px 0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:700;font-size:14.5px}
html,body{overscroll-behavior-y:contain}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) - 30px);z-index:25;width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh-nav);display:grid;place-items:center;color:var(--ink-3);opacity:0;transform:translate(-50%,0);pointer-events:none}
.ptr .i{width:21px;height:21px}
.ptr.ready{color:var(--ink)}
.ptr.spin{opacity:1;color:var(--ink);transform:translate(-50%,64px);transition:transform .2s}
.ptr.spin .i{animation:spin 1s linear infinite}
/* avvisi brevi */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--nav-gap) + 10px);transform:translateX(-50%);z-index:70;max-width:calc(100% - 32px);padding:12px 18px;border-radius:999px;background:color-mix(in srgb,var(--ink) 94%,transparent);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--sh-nav);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.size-s{--read:15.5px}
.size-m{--read:17px}
.size-l{--read:19px}
button.cov{cursor:pointer;margin:-4px -6px;padding:4px 6px;border-radius:10px;transition:background .2s}
button.cov:active{background:var(--pill)}
.agl{margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--card);box-shadow:0 0 0 1px var(--line)}
.agl .agk{display:block;font-size:12px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.agl p{margin:4px 0 0;font-size:14px;line-height:1.45}
.agl p span{color:var(--ink-2)}
.note{margin:10px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.agl .note{margin-top:6px}
.s-off{margin:22px 0 0;padding:12px 14px;border-radius:var(--r-sm);background:var(--pill);font-size:14px;line-height:1.45;color:var(--ink-2)}
.sact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.sact a{margin-top:0}
.flag,.flagsum{min-height:44px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-3);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.flag.armed,.flagsum.armed{color:var(--ink);box-shadow:inset 0 0 0 1px currentColor}
.flagsum{display:block;margin:12px auto 0}
.cmpg{margin-top:12px}
.cmpg small{display:block;margin-bottom:6px;font-size:12px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.cmpc{display:flex;flex-wrap:wrap;gap:6px}
.cmpc span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:13.5px;font-weight:650}
.cmpc em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
