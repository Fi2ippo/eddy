name: Trova feed delle fonti
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/discover_feeds.py
      - run: |
          git config user.name "eddy-bot"; git config user.email "eddy-bot@users.noreply.github.com"
          git add data/sources.json data/feeds_report.json
          git diff --staged --quiet || (git commit -m "fonti: esito ricerca feed" && git push)
