name: Pubblica il sito

# A ogni push su main costruisce il sito statico (cartella out/) e lo pubblica su GitHub Pages:
# https://fi2ippo.github.io/eddy. Le notizie non sono dentro il sito (l'app le scarica dal ramo "dati"),
# quindi la raccolta oraria non richiede di ripubblicarlo.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dipendenze
        run: npm ci

      - name: Controlli
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Costruzione del sito
        env:
          EDDY_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
