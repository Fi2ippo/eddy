name: Raccogli notizie
on:
  schedule:
    - cron: "17 */2 * * *"   # ogni 2 ore (minuto 17 per evitare l'ora di punta)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install feedparser
      - run: python pipeline/collect.py
      - name: Salva i dati
        run: |
          git config user.name "eddy-bot"
          git config user.email "eddy-bot@users.noreply.github.com"
          git add data/stories.json
          git diff --staged --quiet || (git commit -m "dati: aggiornamento automatico" && git push)
