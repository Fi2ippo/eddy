name: Raccogli notizie

# Circa ogni mezz'ora legge i feed, raggruppa le notizie e salva i dati sul ramo "dati".
# Il ramo "dati" contiene un solo commit, sostituito a ogni giro: così il repository non cresce all'infinito.
#
# Gli orari programmati di GitHub ("schedule") partono spesso in ritardo o vengono saltati. Per questo ogni giro,
# RIUSCITO, alla fine, prenota il successivo (lavoro "prenota"): aspetta 30 minuti nell'ambiente "attesa" (Settings →
# Environments, timer di 30 minuti, durante l'attesa non usa macchine) e poi avvia il giro dopo. Se il timer
# manca, il lavoro aspetta da sé. Se un giro fallisce non prenota niente (niente catene infinite di errori):
# lo fa ripartire l'orario programmato, che resta come rete di sicurezza.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # una raccolta alla volta (il lavoro "prenota" di un giro precedente può restare in attesa intanto)
    concurrency:
      group: collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dipendenze
        run: pip install -r pipeline/requirements.txt

      - name: Controlli del codice
        run: |
          python -m py_compile pipeline/*.py
          python pipeline/selftest.py

      - name: Modello di traduzione (copia salvata)
        uses: actions/cache@v4
        with:
          path: .cache/eddy-models
          key: eddy-models-en-it-v1

      - name: Dati del giro precedente (ramo dati)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0; git ls-remote --exit-code --heads "$REPO" dati >/dev/null || rc=$?
          if [ $rc -eq 0 ]; then
            git clone --quiet --depth 1 --branch dati --single-branch "$REPO" dati
          elif [ $rc -eq 2 ]; then
            echo "primo avvio: il ramo dati non esiste ancora"
            mkdir dati && git -C dati init -q -b dati
          else
            echo "::error::ramo dati irraggiungibile, riprovo al prossimo giro"; exit 1
          fi

      - name: Raccolta
        run: python pipeline/collect.py --out dati

      - name: Salva i dati sul ramo dati
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dati
          # un JSON rovinato non deve sostituire i dati buoni: in quel caso il giro dopo riparte dai precedenti
          python -c "import json; [json.load(open(f, encoding='utf-8')) for f in ('stories.json', 'state.json', 'report.json')]"
          cat > README.md <<'EOF'
          # Dati di Eddy
          Questo ramo è scritto in automatico dal workflow "Raccogli notizie" (un solo commit, sostituito ogni ora).
          - `stories.json`: le storie per l'app
          - `report.json`: resoconto dell'ultimo giro
          - `state.json`: memoria fra un giro e l'altro (traduzioni, foto, prima volta che un articolo è stato visto)
          EOF
          git config user.name "eddy-bot"
          git config user.email "eddy-bot@users.noreply.github.com"
          git checkout -q --orphan nuovo
          git add -A
          git commit -qm "dati: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" nuovo:dati
          echo "### Raccolta" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; r=json.load(open('report.json')); print('\n'.join(f'- {k}: {r[k]}' for k in ('stories','stories_2plus','stories_with_image','stories_translated','articles','google_news_titles','seconds')))" >> "$GITHUB_STEP_SUMMARY"

  prenota:
    needs: collect
    if: ${{ success() }} # solo dopo un giro riuscito; dopo un errore riparte col cron
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: attesa
    permissions:
      actions: write
      contents: read
    steps:
      - name: Prenota il prossimo giro
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # se l'ambiente "attesa" non ha il timer, aspetto qui il tempo che manca (almeno 30 minuti dall'inizio del giro)
          started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          if [ "$elapsed" -lt 1800 ]; then echo "attendo $(( (1800 - elapsed) / 60 )) minuti"; sleep $(( 1800 - elapsed )); fi
          # se c'è già un altro giro in coda o in corso, non ne prenoto un secondo
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow collect.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(.status != \"completed\")] | length")
          if [ "$others" -gt 0 ]; then echo "c'è già un giro in arrivo: non ne prenoto un altro"; exit 0; fi
          gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "prossimo giro prenotato"
